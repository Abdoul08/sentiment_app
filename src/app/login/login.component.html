<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-12 col-sm-8 col-md-6">
      <h2 class="text-center mb-4">Connexion</h2>
      <form (ngSubmit)="onLogin()">
        <div class="form-group mb-3">
          <label for="email" class="form-label">Email</label>
          <input type="email" [(ngModel)]="username" name="username" class="form-control" placeholder="Entrez votre email" required>
        </div>
        <div class="form-group mb-3">
          <label for="password" class="form-label">Mot de passe</label>
          <input type="password" [(ngModel)]="password" name="password" class="form-control" placeholder="Mot de passe" required>
        </div>
        <div *ngIf="loginError" class="alert alert-danger text-center">
          {{ loginError }}
        </div>
        <button type="submit" class="btn btn-outline-dark">Se connecter</button>
      </form>
    </div>
  </div>
</div>
