<div class="container mt-5">
    <h2 class="text-center mb-4">Résultats de l'analyse de sentiment des vidéos YouTube</h2>
  
    <!-- Barre de sélection pour filtrer par sentiment et par chaîne -->
    <div class="d-flex justify-content-between mb-3">
      <!-- Filtre de sentiment -->
      <div class="input-group me-2">
        <select class="form-select" [(ngModel)]="selectedSentiment" (change)="filterResults()">
          <option value="">Tous les sentiments</option>
          <option value="POSITIVE">Positif</option>
          <option value="NEUTRAL">Neutre</option>
          <option value="NEGATIVE">Négatif</option>
          <option value="MIXED">Mixte</option>
        </select>
      </div>
  
      <!-- Filtre de chaîne -->
      <div class="input-group">
        <select class="form-select" [(ngModel)]="selectedChannel" (change)="filterResults()">
          <option value="">Toutes les chaînes</option>
          <option value="FRANCE 24">FRANCE 24</option>
          <option value="Nat Geo France">Nat Geo France</option>

        </select>
      </div>
    </div>
  
    <div class="card">
      <div class="card-body">
        <table class="table table-hover">
          <thead>
            <tr>
              <th scope="col">Chaîne</th>
              <th scope="col">Titre</th>
              <th scope="col">Sentiment</th>
              <th scope="col">Détails</th>
            </tr>
          </thead>
          <tbody>
            <!-- Affichage des éléments de la page courante uniquement, avec filtre appliqué -->
            <ng-container *ngFor="let apiItem of paginatedData(); let i = index">
              <tr *ngIf="i > 0">
                <td *ngIf="apiItem.Data[0]">{{ apiItem.Data[0].VarCharValue }}</td>
                <td *ngIf="apiItem.Data[2]">{{ apiItem.Data[2].VarCharValue }}</td>
  
                <td *ngIf="apiItem.Data[6]">
                  <span
                    [ngClass]="{
                      'badge bg-success': apiItem.Data[6].VarCharValue === 'POSITIVE',
                      'badge bg-warning text-dark': apiItem.Data[6].VarCharValue === 'NEUTRAL',
                      'badge bg-danger': apiItem.Data[6].VarCharValue === 'NEGATIVE',
                      'badge bg-info text-dark': apiItem.Data[6].VarCharValue === 'MIXED'
                    }">
                    {{ apiItem.Data[6].VarCharValue }}
                  </span>
                </td>
  
                <td>
                  <button class="btn btn-primary" routerLink="/details">Détails</button>
                </td>
              </tr>
            </ng-container>
          </tbody>
        </table>
      </div>
    </div>
  
    <nav>
      <ul class="pagination justify-content-center mt-4">
        <li class="page-item" [class.disabled]="currentPage === 1">
          <a class="page-link" (click)="goToPage(currentPage - 1)">Précédent</a>
        </li>
        <li class="page-item" *ngFor="let page of pages" [class.active]="page === currentPage">
          <a class="page-link" (click)="goToPage(page)">{{ page }}</a>
        </li>
        <li class="page-item" [class.disabled]="currentPage === totalPages">
          <a class="page-link" (click)="goToPage(currentPage + 1)">Suivant</a>
        </li>
      </ul>
    </nav>
  </div>
